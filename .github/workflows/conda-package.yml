# Builds the allfeature conda package (linux-64, CUDA 12.9) on pushes to dev and main, and publishes it to
# https://prefix.dev/vslamlab/vslamlab when a version tag (vX.Y.Z) is pushed.
# Publishing uses prefix.dev trusted publishing (OIDC): prefix.dev > Settings > Repository Access > GitHub,
# repository alejandrofontan/AllFeature-VSLAM, workflow conda-package.yml, read/write on vslamlab/vslamlab.
#
# Release: bump `version` in pixi.toml [package], push, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: conda-package

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # CUDA + TensorRT + libtorch build environments do not fit in the runner's default free space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          version = tomllib.load(open('pixi.toml', 'rb'))['package']['version']
          if tag != version:
              sys.exit(f'tag v{tag} does not match pixi.toml [package] version {version}')
          print(f'version {tag} OK')
          EOF

      # --clean: pixi reuses its build directory otherwise, and stale files end up in the package
      - name: Build
        run: pixi publish --clean --to "$PWD/channel"

      # No GPU on the runner: install the package and check what can be checked without one. TensorRT requires the
      # __cuda virtual package, which the runner lacks; CONDA_OVERRIDE_CUDA declares it for the solver.
      - name: Test
        env:
          CONDA_OVERRIDE_CUDA: "12.9"
        run: |
          pkgs=(channel/linux-64/allfeature-*.conda)
          [ -f "${pkgs[0]}" ] || { echo "no package built"; exit 1; }
          pixi exec -c "$PWD/channel" -c https://prefix.dev/conda-forge -c https://prefix.dev/vslamlab/vslamlab \
                    -c https://repo.prefix.dev/spqr-tests -s allfeature -- bash -c '
            status=0
            for b in vslamlab_allfeature_mono vslamlab_allfeature_rgbd vslamlab_allfeature_mono_stream; do
              missing=$(ldd "$CONDA_PREFIX/bin/$b" | grep "not found" | grep -v "libcuda.so" || true)
              if [ -n "$missing" ]; then echo "$b: unresolved libraries:"; echo "$missing"; status=1; fi
            done
            if grep -a -o -E "[[:print:]]{0,60}lightglue_models" "$CONDA_PREFIX/lib/libAllFeature-VSLAM.so" | grep -q "/lightglue_models"; then
              echo "LIGHTGLUE_MODELS_DIR compiled in as an absolute path"; status=1
            fi
            for f in share/allfeature-vslamlab/vslamlab_allfeature-dev_settings.yaml share/allfeature-vslamlab/settings/orb32_settings.yaml include/AllFeature-VSLAM/System.h; do
              [ -f "$CONDA_PREFIX/$f" ] || { echo "missing $f"; status=1; }
            done
            [ $status -eq 0 ] && echo "allfeature package OK"
            exit $status'

      - uses: actions/upload-artifact@v7
        with:
          name: allfeature-package
          path: channel/linux-64/allfeature-*.conda
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allfeature-package
          path: packages

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      # --skip-existing: a re-run after a partial upload never overwrites a published file
      - name: Upload to prefix.dev
        run: pixi exec rattler-build upload prefix --skip-existing --channel vslamlab/vslamlab packages/*.conda
