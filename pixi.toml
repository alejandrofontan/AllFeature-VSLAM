[workspace]
authors = ["alejandrofontan <fontanvillacampa@gmail.com>"]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/vslamlab/vslamlab", "https://repo.prefix.dev/spqr-tests"]

name = "AllFeature-VSLAM-DEV"
# osx-arm64 (docs/plans/mac_port.md): the GPU packages (CUDA, TensorRT, libtorch, SiftGPU) and the X11 display stack are
# linux-64 target dependencies below, so the default / build environments resolve on the Mac without them and the
# GPU-free build (`./build.sh -c`, ALLFEATURE_WITH_* OFF) is what gets built there.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" }, "osx-arm64"]
version = "0.1.0"
preview = ["pixi-build"]

# ------------------------------------------------------------------------------------
# default env  = RUNTIME: everything the built executables load (per ldd) plus the
#                hf CLI for the model-download tasks. LightGlue links libtorch, so
#                pytorch-gpu is genuinely a runtime dependency.
# build env    = runtime + compilers/CMake/headers; `pixi run build` / `setup` resolve
#                to it automatically (pixi picks the env that defines the task).
# ------------------------------------------------------------------------------------

[tasks]
git-clone = "git clone https://github.com/alejandrofontan/AllFeature-VSLAM.git --recursive"

# Model downloads (skipped once the ONNX is present, e.g. after a local export or a
# wrapper-driven install; the TensorRT engines are built from these on first run and
# cached next to them)
download-megaloc-models = { cmd = "hf download vslamlab/megaloc-models --local-dir megaloc_models", outputs = ["megaloc_models/*.onnx"] }
download-segmentation-models = { cmd = "hf download vslamlab/allfeature-vslamlab --include 'efficientvit-seg*' --local-dir segmentation_models", outputs = ["segmentation_models/*.onnx"] }
# Learned feature models on ONNX Runtime (docs/plans/learned_features_onnxruntime.md): the four redistributable
# exports (ALIKED, BSD-3; the three LightGlue matchers, Apache-2.0) with their sidecars come from the HF repo's
# feature_models/ folder. SuperPoint's weights are Magic Leap's (non-commercial research, no redistribution: plan
# Q6), so superpoint_v1.onnx is exported locally from the official file by `export-superpoint` (export-features env).
download-feature-models = { cmd = "hf download vslamlab/allfeature-vslamlab --include 'feature_models/*' --local-dir .", outputs = ["feature_models/lightglue_superpoint.onnx"] }

execute-mono = { cmd = "./bin/vslamlab_allfeature_mono" }
execute-rgbd = { cmd = "./bin/vslamlab_allfeature_rgbd" }
stream = { cmd = "./bin/vslamlab_allfeature_mono_stream" }   # RTMP video (e.g. Larix on the phone), see issue #48
# Online on an ARStream relay (VSLAM-LAB: `pixi run stream-iphone --run allfeature-dev [--mode rgbd]`), see
# src/vslamlab_allfeature_{mono,rgbd}_arstream.cpp
execute-mono-stream = { cmd = "./bin/vslamlab_allfeature_mono_arstream" }
execute-rgbd-stream = { cmd = "./bin/vslamlab_allfeature_rgbd_arstream" }

[dependencies]
python = "3.11.*"
huggingface_hub = "*"   # `hf` CLI for the download tasks
# ARStream C++ subscriber (header-only, github.com/VSLAM-LAB/arstream) for the *_arstream entry points; 0.2.2 carries
# the LiDAR depth of the rgbd one without pinning OpenCV (this repo pins 4.12)
libarstream = { version = ">=0.2.2", channel = "https://prefix.dev/vslamlab/vslamlab" }

# SLAM runtime libraries (every platform)
opencv = "4.12.*"
yaml-cpp = "*"
pangolin-opengl = "*"
zlib = "*"
# Feature libraries packaged in github.com/VSLAM-LAB/conda-recipes (prefix.dev/vslamlab/vslamlab); 1.0.1 is the first
# release with osx-arm64 (and linux-aarch64) builds: brisk on sse2neon + NEON, akaze with OpenMP on macOS too
brisk = ">=1.0.1"
akaze = ">=1.0.1"
# ONNX Runtime: the MegaLoc VPR backend (Thirdparty/placecell, vpr: megaloc) on every platform; the execution
# provider is a runtime choice (megaloc_provider: cuda on linux-64 with the cuda129 build below, coreml / cpu on
# osx-arm64 with the cpu build, which carries the CoreML provider) — docs/plans/megaloc_onnxruntime.md
onnxruntime-cpp = "1.31.*"

[target.osx-arm64.dependencies]
llvm-openmp = "*"   # Apple clang ships no OpenMP runtime; the brute-force matcher and local mapping use it

# linux-64 only: CUDA (ONNX Runtime's CUDA provider, TensorRT segmentation) and the X11 display stack
[target.linux-64.dependencies]
# CUDA runtime libraries (the -dev variants also carry the headers the build needs;
# splitting lib/header per package is a finer pass than is worth it here)
cuda-version = "12.9.*"
cuda-cudart-dev = "*"
onnxruntime-cpp = { version = "1.31.*", build = "*cuda129*" }   # CUDA execution provider (dlopens libcudart / cudnn at runtime)
cuda-nvrtc-dev = "*"    # TensorRT loads libnvrtc at runtime
cuda-nvtx = "*"
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
libcusparse-dev = "*"
cusparselt = "*"
libnvjitlink = "*"

# TensorRT: -full carries libnvinfer/nvonnxparser (needed to LOAD engines), -builder the
# tactics resource needed to BUILD them -- which happens at runtime, on the first run on
# each GPU (engines are machine-specific, then cached next to the ONNX). Neither is a
# compile-time-only dependency.
tensorrt-cxx = "*"
tensorrt-cxx-full = "*"
tensorrt-cxx-builder = "*"

# Display stack (Pangolin viewer)
xorg-libxext = "*"
xorg-libx11 = "*"
xorg-libxfixes = "*"
xorg-libxrender = "*"
xorg-libice = "*"
xorg-libsm = "*"
xorg-libxdmcp = "*"
xorg-libxau = "*"
xorg-xorgproto = "*"
libxkbcommon = "*"
libgl-devel = "*"
libegl-devel = "*"
libglvnd-devel = "*"
libopengl-devel = "*"

[feature.build.dependencies]
# Toolchain
cxx-compiler = "*"
compilers = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"

# Build-only headers/tools
eigen = "3.4.*"   # match vendored g2o's system-Eigen fallback; 5.x mixes fatally with it

[feature.build.target.linux-64.dependencies]
cuda-compiler = "*"
cuda-nvcc = "*"
cuda-crt = "*"
cuda-driver-dev = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
tensorrt-cxx-headers = "*"   # NvInfer.h etc. for compilation (the runtime libs live in default)

[feature.build.tasks]
build = { cmd = "./build.sh" }
build-cpu = { cmd = "./build.sh -c" }   # GPU-free build (build-cpu/, same bin/ and lib/): the Mac build, also testable on Linux
# setup = everything a fresh clone needs to run: fetch the models, then compile
setup = { depends-on = ["download-megaloc-models", "download-segmentation-models", "download-feature-models", { task = "export-superpoint", environment = "export-features" }, "build"] }

# macOS: no GPU backend yet (mac_port.md phases 2-5), so setup skips the model downloads; CMake defaults every
# ALLFEATURE_WITH_* option to OFF on Apple, hence plain `build` is already the GPU-free build there
[feature.build.target.osx-arm64.tasks]
setup = { depends-on = ["build"] }

# cpu env = the GPU-free build and run environment with NO CUDA / TensorRT / libtorch / SiftGPU package at all (what
# the Mac has; on Linux it proves the GPU-free configuration never touches them). It defines no tasks: a task name
# that exists in two features makes a bare `pixi run <task>` ambiguous, which breaks the parent framework's
# `pixi run --frozen execute-mono` forward. Run the commands directly: `pixi run -e cpu ./build.sh -c` and
# `pixi run -e cpu ./bin/vslamlab_allfeature_mono ...`. Model downloads are not needed for it.
[feature.cpu.dependencies]
python = "3.11.*"
libarstream = { version = ">=0.2.2", channel = "https://prefix.dev/vslamlab/vslamlab" }   # the *_arstream entry points
cxx-compiler = "*"
compilers = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
eigen = "3.4.*"
opencv = "4.12.*"
yaml-cpp = "*"
pangolin-opengl = "*"
zlib = "*"
brisk = ">=1.0.1"
akaze = ">=1.0.1"
onnxruntime-cpp = "1.31.*"   # MegaLoc on the CPU provider (osx-arm64: + CoreML); the GPU-free configuration keeps vpr: megaloc

[feature.cpu.target.osx-arm64.dependencies]
llvm-openmp = "*"

[feature.cpu.target.linux-64.dependencies]
onnxruntime-cpp = { version = "1.31.*", build = "*cpu*" }   # the CPU-only build, not the cuda one the solver would pick
xorg-libxext = "*"
xorg-libx11 = "*"
xorg-libxfixes = "*"
xorg-libxrender = "*"
xorg-libice = "*"
xorg-libsm = "*"
xorg-libxdmcp = "*"
xorg-libxau = "*"
xorg-xorgproto = "*"
libxkbcommon = "*"
libgl-devel = "*"
libegl-devel = "*"
libglvnd-devel = "*"
libopengl-devel = "*"

# docs env = MkDocs site only (no CUDA/torch): `pixi run docs-serve`, `pixi run docs-build`
[feature.docs.dependencies]
python = "3.12.*"
mkdocs-material = "*"
mkdocs-mermaid2-plugin = "*"
mkdocs-literate-nav = "*"

[feature.docs.tasks]
docs-serve = { cmd = "mkdocs serve", env = { DISABLE_MKDOCS_2_WARNING = "true" } }
docs-build = { cmd = "mkdocs build --strict", env = { DISABLE_MKDOCS_2_WARNING = "true" } }
docs-links = { cmd = "python docs/tools/resolve_links.py" }
docs-settings = { cmd = "python docs/tools/settings_keys.py" }
docs-checklists = { cmd = "python docs/tools/review_checklist.py --all" }
# everything a docs commit should pass: fresh line numbers, fresh settings page, strict site build
docs-check = { cmd = "python docs/tools/resolve_links.py --check && python docs/tools/settings_keys.py --check && mkdocs build --strict", env = { DISABLE_MKDOCS_2_WARNING = "true" } }

# export-features env = the ONNX export of the learned feature models (docs/plans/learned_features_onnxruntime.md,
# steps 1-3): torch CPU + onnx tooling, linux-64 only (the exports are files; the Mac consumes them). Its own
# environment without the default feature: the default feature carries the runtime pytorch-gpu 2.7 on linux-64,
# which cannot share an environment with pytorch-cpu.
[feature.export-features]
platforms = ["linux-64-cuda", "osx-arm64"]   # osx-arm64 too: every machine exports SuperPoint itself (plan Q6)

[feature.export-features.tasks]
# PYTHONNOUSERSITE: keep ~/.local/lib/pythonX.Y/site-packages out of the env (a stale user-site package there, e.g.
# an empty `triton` folder, shadows the real module and breaks torch's import) - the placecell export task's lesson
export-features = { cmd = "python tools/export_features.py", env = { PYTHONNOUSERSITE = "1" } }
# SuperPoint only (feature_models/superpoint_v1.onnx + fp16 twin + sidecars) - the one model that is not downloaded
export-superpoint = { cmd = "python tools/export_features.py --only superpoint", env = { PYTHONNOUSERSITE = "1" }, outputs = ["feature_models/superpoint_v1.onnx"] }
# publish the four redistributable exports + sidecars (never SuperPoint, never the references / cache); needs `hf auth login`
upload-feature-models = { cmd = "hf upload vslamlab/allfeature-vslamlab feature_models feature_models --include='aliked_*.onnx*' --include='lightglue_*.onnx*'" }

[feature.export-features.dependencies]
python = "3.11.*"
# Torch libraries: >=2.9 for the torch.export-based ONNX exporter (dynamo=True, the default since 2.9). CPU build:
# the exports and the self-checks run on the CPU in seconds to minutes, no CUDA packages needed.
pytorch-cpu = ">=2.9"
torchvision = "*"            # torchvision.ops.deform_conv2d (ALIKED) - the op that gets a custom ONNX translation
kornia = "*"                 # imported by the upstream lightglue/superpoint.py and aliked.py (colour conversion)
# ONNX libraries
onnx = "*"
onnxscript = "*"             # the dynamo exporter's op translations + graph optimiser; the DeformConv translation
onnxruntime = "*"            # self-check column (c): the export on ORT CPU
onnxconverter-common = "*"   # fp16-weights twins
huggingface_hub = "*"
opencv = "4.12.*"            # cv2: the C++-equivalent preprocessing in the self-check, and cv2.SIFT for the reference
git = "*"
numpy = "<2"

[environments]
build = ["build"]
cpu = { features = ["cpu"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
export-features = { features = ["export-features"], no-default-feature = true }

########################################################################################################################
# Package: `allfeature` (the three executables, libAllFeature-VSLAM + its shared libraries, headers under
# include/AllFeature-VSLAM/, reference settings under share/allfeature-vslamlab/), published to
# https://prefix.dev/vslamlab/vslamlab by CI on vX.Y.Z tags (.github/workflows/conda-package.yml).
#   pixi publish --clean --target-dir output
# The same CMake project as build.sh, with ALLFEATURE_NATIVE off: x86-64-v3 and a fixed GPU list for the
# Light_Glue_CPP kernels ("90" also embeds PTX for newer GPUs). No model weights are shipped: the executables resolve
# megaloc_models/, segmentation_models/, superpoint_models/ and lightglue_models/ against the cwd, and VSLAM-LAB's
# allfeature environment downloads them next to the settings.
[package]
name = "allfeature"
version = "1.0.0"
description = "AllFeature-VSLAM: multi-feature visual SLAM (ORB-SLAM2 lineage) with learned features, MegaLoc place recognition and online segmentation"
authors = ["Alejandro Fontan", "Javier Civera", "Michael Milford"]
license = "GPL-3.0-only"
homepage = "https://github.com/alejandrofontan/AllFeature-VSLAM"
repository = "https://github.com/alejandrofontan/AllFeature-VSLAM"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.*" }

[package.build.config]
compilers = ["c", "cxx", "cuda"]
# x86-64-v3 (CMakeLists.txt); outputs stay in the build directory, not in bin/ and lib/
extra-args = ["-DALLFEATURE_NATIVE=OFF", "-DALLFEATURE_OUTPUT_IN_SOURCE=OFF"]
env = { CMAKE_BUILD_PARALLEL_LEVEL = "3" }

[package.build-dependencies]
python = "*"            # find_package(Python COMPONENTS Interpreter)
cuda-version = "12.9.*"

[package.host-dependencies]
cuda-version = "12.9.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
cuda-driver-dev = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
libcusparse-dev = "*"
cusparselt = "*"
libnvjitlink = "*"
onnxruntime-cpp = { version = "1.31.*", build = "*cuda129*" }   # learned features + MegaLoc VPR backend
tensorrt-cxx-headers = "10.3.*"   # validated TensorRT (spqr-tests channel); online segmentation
tensorrt-cxx-full = "10.3.*"
tensorrt-cxx-onnx = "10.3.*"
libopencv = "4.12.*"
eigen = "3.4.*"         # vendored g2o mixes fatally with Eigen 5
yaml-cpp = "*"
pangolin-opengl = "*"
brisk = "*"
akaze = "*"
zlib = "*"
libgl-devel = "*"
libegl-devel = "*"
libglvnd-devel = "*"
libopengl-devel = "*"
xorg-libx11 = "*"
xorg-libxext = "*"
libxkbcommon = "*"

[package.run-dependencies]
cuda-nvrtc = "*"        # TensorRT loads libnvrtc at runtime
onnxruntime-cpp = { version = "1.31.*", build = "*cuda129*" }   # learned features + MegaLoc VPR backend
cuda-cudart = "*"       # dlopened by ONNX Runtime's CUDA provider, not a declared dependency of its package
tensorrt-cxx-full = "10.3.*"
tensorrt-cxx-onnx = "10.3.*"
tensorrt-cxx-builder = "10.3.*"   # engines are built from the ONNX on the first run on each GPU
pangolin-opengl = "*"
brisk = "*"
akaze = "*"
