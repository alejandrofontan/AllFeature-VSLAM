[workspace]
authors = ["alejandrofontan <fontanvillacampa@gmail.com>"]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/vslamlab/vslamlab", "https://repo.prefix.dev/spqr-tests"]

name = "AllFeature-VSLAM-DEV"
# osx-arm64 (docs/plans/mac_port.md): the GPU packages (CUDA, TensorRT, libtorch, SiftGPU) and the X11 display stack are
# linux-64 target dependencies below, so the default / build environments resolve on the Mac without them and the
# GPU-free build (`./build.sh -c`, ALLFEATURE_WITH_* OFF) is what gets built there.
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" }, "osx-arm64"]
version = "0.1.0"
preview = ["pixi-build"]

# ------------------------------------------------------------------------------------
# default env  = RUNTIME: everything the built executables load (per ldd) plus the
#                hf CLI for the model-download tasks. LightGlue links libtorch, so
#                pytorch-gpu is genuinely a runtime dependency.
# build env    = runtime + compilers/CMake/headers; `pixi run build` / `setup` resolve
#                to it automatically (pixi picks the env that defines the task).
# ------------------------------------------------------------------------------------

[tasks]
git-clone = "git clone https://github.com/alejandrofontan/AllFeature-VSLAM.git --recursive"

# Model downloads (skipped once the ONNX is present, e.g. after a local export or a
# wrapper-driven install; the TensorRT engines are built from these on first run and
# cached next to them)
download-megaloc-models = { cmd = "hf download vslamlab/megaloc-models --local-dir megaloc_models", outputs = ["megaloc_models/*.onnx"] }
download-segmentation-models = { cmd = "hf download vslamlab/allfeature-vslamlab --include 'efficientvit-seg*' --local-dir segmentation_models", outputs = ["segmentation_models/*.onnx"] }
# SuperPoint + SuperPoint-LightGlue ONNX (and their config.yaml) and the ALIKED + LightGlue torch
# weights: no longer tracked in the Thirdparty submodules, served from the same HF repo as
# subfolders, downloaded to superpoint_models/ and lightglue_models/ next to the other model folders
download-superpoint-models = { cmd = "hf download vslamlab/allfeature-vslamlab --include 'superpoint_models/*' --local-dir .", outputs = ["superpoint_models/*.onnx"] }
download-lightglue-models = { cmd = "hf download vslamlab/allfeature-vslamlab --include 'lightglue_models/*' --local-dir .", outputs = ["lightglue_models/*.pt"] }

execute-mono = { cmd = "./bin/vslamlab_allfeature_mono" }
execute-rgbd = { cmd = "./bin/vslamlab_allfeature_rgbd" }
stream = { cmd = "./bin/vslamlab_allfeature_mono_stream" }

[dependencies]
python = "3.11.*"
huggingface_hub = "*"   # `hf` CLI for the download tasks

# SLAM runtime libraries (every platform)
opencv = "4.12.*"
yaml-cpp = "*"
pangolin-opengl = "*"
zlib = "*"

[target.osx-arm64.dependencies]
llvm-openmp = "*"   # Apple clang ships no OpenMP runtime; the brute-force matcher and local mapping use it

# linux-64 only: GPU backends and the feature libraries packaged for linux-64 so far (brisk / akaze: osx-arm64
# builds of github.com/VSLAM-LAB/conda-recipes pending, mac_port.md decision 2; the CMake build makes them optional)
[target.linux-64.dependencies]
# CUDA runtime libraries (the -dev variants also carry the headers the build needs;
# splitting lib/header per package is a finer pass than is worth it here)
cuda-version = "12.9.*"
cuda-cudart-dev = "*"
cuda-nvrtc-dev = "*"    # torch JIT loads libnvrtc at runtime
cuda-nvtx = "*"
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
libcusparse-dev = "*"
cusparselt = "*"
libnvjitlink = "*"

# libtorch (linked by Light_Glue_CPP)
pytorch-gpu = "2.7.*"   # libtorch 2.7 (Light_Glue_CPP); its cuda129 build shares libprotobuf 6.31 with OpenCV 4.12

# TensorRT: -full carries libnvinfer/nvonnxparser (needed to LOAD engines), -builder the
# tactics resource needed to BUILD them -- which happens at runtime, on the first run on
# each GPU (engines are machine-specific, then cached next to the ONNX). Neither is a
# compile-time-only dependency.
tensorrt-cxx = "*"
tensorrt-cxx-full = "*"
tensorrt-cxx-builder = "*"
# Feature libraries packaged in github.com/VSLAM-LAB/conda-recipes (prefix.dev/vslamlab/vslamlab)
brisk = "*"
akaze = "*"
siftgpu = "*"
glew = "*"

# Display stack (Pangolin viewer)
xorg-libxext = "*"
xorg-libx11 = "*"
xorg-libxfixes = "*"
xorg-libxrender = "*"
xorg-libice = "*"
xorg-libsm = "*"
xorg-libxdmcp = "*"
xorg-libxau = "*"
xorg-xorgproto = "*"
libxkbcommon = "*"
libgl-devel = "*"
libegl-devel = "*"
libglvnd-devel = "*"
libopengl-devel = "*"

[feature.build.dependencies]
# Toolchain
cxx-compiler = "*"
compilers = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"

# Build-only headers/tools
eigen = "3.4.*"   # match vendored g2o's system-Eigen fallback; 5.x mixes fatally with it

[feature.build.target.linux-64.dependencies]
cuda-compiler = "*"
cuda-nvcc = "*"
cuda-crt = "*"
cuda-driver-dev = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
tensorrt-cxx-headers = "*"   # NvInfer.h etc. for compilation (the runtime libs live in default)

[feature.build.tasks]
build = { cmd = "./build.sh" }
build-cpu = { cmd = "./build.sh -c" }   # GPU-free build (build-cpu/, same bin/ and lib/): the Mac build, also testable on Linux
# setup = everything a fresh clone needs to run: fetch the models, then compile
setup = { depends-on = ["download-megaloc-models", "download-segmentation-models", "download-superpoint-models", "download-lightglue-models", "build"] }

# macOS: no GPU backend yet (mac_port.md phases 2-5), so setup skips the model downloads; CMake defaults every
# ALLFEATURE_WITH_* option to OFF on Apple, hence plain `build` is already the GPU-free build there
[feature.build.target.osx-arm64.tasks]
setup = { depends-on = ["build"] }

# cpu env = the GPU-free build and run environment with NO CUDA / TensorRT / libtorch / SiftGPU package at all (what
# the Mac has; on Linux it proves the GPU-free configuration never touches them): `pixi run -e cpu build`,
# `pixi run -e cpu execute-mono ...`. Model downloads are not needed for it.
[feature.cpu.dependencies]
python = "3.11.*"
cxx-compiler = "*"
compilers = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
eigen = "3.4.*"
opencv = "4.12.*"
yaml-cpp = "*"
pangolin-opengl = "*"
zlib = "*"

[feature.cpu.target.osx-arm64.dependencies]
llvm-openmp = "*"

[feature.cpu.target.linux-64.dependencies]
brisk = "*"
akaze = "*"
xorg-libxext = "*"
xorg-libx11 = "*"
xorg-libxfixes = "*"
xorg-libxrender = "*"
xorg-libice = "*"
xorg-libsm = "*"
xorg-libxdmcp = "*"
xorg-libxau = "*"
xorg-xorgproto = "*"
libxkbcommon = "*"
libgl-devel = "*"
libegl-devel = "*"
libglvnd-devel = "*"
libopengl-devel = "*"

[feature.cpu.tasks]
build = { cmd = "./build.sh -c" }
execute-mono = { cmd = "./bin/vslamlab_allfeature_mono" }
execute-rgbd = { cmd = "./bin/vslamlab_allfeature_rgbd" }
stream = { cmd = "./bin/vslamlab_allfeature_mono_stream" }

# docs env = MkDocs site only (no CUDA/torch): `pixi run docs-serve`, `pixi run docs-build`
[feature.docs.dependencies]
python = "3.12.*"
mkdocs-material = "*"
mkdocs-mermaid2-plugin = "*"
mkdocs-literate-nav = "*"

[feature.docs.tasks]
docs-serve = { cmd = "mkdocs serve", env = { DISABLE_MKDOCS_2_WARNING = "true" } }
docs-build = { cmd = "mkdocs build --strict", env = { DISABLE_MKDOCS_2_WARNING = "true" } }
docs-links = { cmd = "python docs/tools/resolve_links.py" }
docs-settings = { cmd = "python docs/tools/settings_keys.py" }
docs-checklists = { cmd = "python docs/tools/review_checklist.py --all" }
# everything a docs commit should pass: fresh line numbers, fresh settings page, strict site build
docs-check = { cmd = "python docs/tools/resolve_links.py --check && python docs/tools/settings_keys.py --check && mkdocs build --strict", env = { DISABLE_MKDOCS_2_WARNING = "true" } }

[environments]
build = ["build"]
cpu = { features = ["cpu"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }

########################################################################################################################
# Package: `allfeature` (the three executables, libAllFeature-VSLAM + its shared libraries, headers under
# include/AllFeature-VSLAM/, reference settings under share/allfeature-vslamlab/), published to
# https://prefix.dev/vslamlab/vslamlab by CI on vX.Y.Z tags (.github/workflows/conda-package.yml).
#   pixi publish --clean --target-dir output
# The same CMake project as build.sh, with ALLFEATURE_NATIVE off: x86-64-v3 and a fixed GPU list for the
# Light_Glue_CPP kernels ("90" also embeds PTX for newer GPUs). No model weights are shipped: the executables resolve
# megaloc_models/, segmentation_models/, superpoint_models/ and lightglue_models/ against the cwd, and VSLAM-LAB's
# allfeature environment downloads them next to the settings.
[package]
name = "allfeature"
version = "1.0.0"
description = "AllFeature-VSLAM: multi-feature visual SLAM (ORB-SLAM2 lineage) with learned features, MegaLoc place recognition and online segmentation"
authors = ["Alejandro Fontan", "Javier Civera", "Michael Milford"]
license = "GPL-3.0-only"
homepage = "https://github.com/alejandrofontan/AllFeature-VSLAM"
repository = "https://github.com/alejandrofontan/AllFeature-VSLAM"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.*" }

[package.build.config]
compilers = ["c", "cxx", "cuda"]
# x86-64-v3 and the portable GPU list (CMakeLists.txt); outputs stay in the build directory, not in bin/ and lib/
extra-args = ["-DALLFEATURE_NATIVE=OFF", "-DALLFEATURE_OUTPUT_IN_SOURCE=OFF"]
# libtorch-heavy translation units (Light_Glue_CPP) take several GB each at -O3
env = { CMAKE_BUILD_PARALLEL_LEVEL = "3" }

[package.build-dependencies]
python = "*"            # find_package(Python COMPONENTS Interpreter)
cuda-version = "12.9.*"

[package.host-dependencies]
cuda-version = "12.9.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
cuda-driver-dev = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
libcusparse-dev = "*"
cusparselt = "*"
libnvjitlink = "*"
libtorch = { version = "2.7.*", build = "cuda*" }   # cuda129 build: libprotobuf 6.31, like OpenCV 4.12
tensorrt-cxx-headers = "10.3.*"   # validated TensorRT (spqr-tests channel)
tensorrt-cxx-full = "10.3.*"
tensorrt-cxx-onnx = "10.3.*"
libopencv = "4.12.*"
eigen = "3.4.*"         # vendored g2o mixes fatally with Eigen 5
yaml-cpp = "*"
pangolin-opengl = "*"
brisk = "*"
akaze = "*"
siftgpu = "*"
glew = "*"
zlib = "*"
libgl-devel = "*"
libegl-devel = "*"
libglvnd-devel = "*"
libopengl-devel = "*"
xorg-libx11 = "*"
xorg-libxext = "*"
libxkbcommon = "*"

[package.run-dependencies]
libtorch = { version = "2.7.*", build = "cuda*" }
cuda-nvrtc = "*"        # torch JIT loads libnvrtc at runtime
tensorrt-cxx-full = "10.3.*"
tensorrt-cxx-onnx = "10.3.*"
tensorrt-cxx-builder = "10.3.*"   # engines are built from the ONNX on the first run on each GPU
pangolin-opengl = "*"
brisk = "*"
akaze = "*"
siftgpu = "*"
