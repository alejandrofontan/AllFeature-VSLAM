%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera names
#--------------------------------------------------------------------------------------------
cam_mono: rgb_0
features: ["orb32", "superpoint256"]
vpr: "megaloc"       # visual place recognition backend: "megaloc" (default) | "none"
feature_vpr: "orb32" # local feature that verifies retrieved candidates (reloc PnP, loop Sim3);
                     # must be in features; defaults to the first feature.
megaloc_onnx: "megaloc_models/megaloc_322x322.onnx" # vpr: megaloc — the model file to load, exported by Thirdparty/placecell/tools/export_megaloc.py:
                                                     # this fp32 file (the reference, fastest on the CPU provider) or "megaloc_models/megaloc_322x322_fp16.onnx"
                                                     # (fp16 weights, float32 I/O: the file for the CUDA / CoreML providers)
megaloc_provider: "auto"                             # ONNX Runtime execution provider: "auto" (CUDA where built in, else CoreML on macOS, else CPU) |
                                                     # "cuda" | "coreml" | "cpu"; an unavailable provider falls back to auto with a warning.
                                                     # Measured 2026-10-13 (Thirdparty/placecell/docs/notes/2026-10-13_megaloc_onnxruntime_backend.md):
                                                     # CUDA 8-12 ms/image (RTX 4000 Ada), CoreML 46-48 ms (M1 Pro GPU), CPU 120-230 ms (8 / 6 threads)
megaloc_threads: 4                                   # ONNX Runtime CPU-provider threads (never the core count: tracking and mapping need the rest;
                                                     # scaling is near-linear up to the performance cores: 6 on an M1 Pro, 8 on the workstation)
megaloc_coreml_units: "ALL"                          # CoreML compute units: "ALL" | "CPUAndGPU" | "CPUAndNeuralEngine" | "CPUOnly". The Neural Engine
                                                     # loses accuracy (cos 0.982 vs the 0.9955 floor with the fp16 file on "ALL" / "CPUAndNeuralEngine");
                                                     # the GPU is exact: fp32 file + "ALL" (48 ms) or the fp16 file + "CPUAndGPU" (46 ms, half the download)
features_models_dir: "feature_models"               # learned feature models on ONNX Runtime (superpoint256, aliked128 and the LightGlue matchers of
                                                     # superpoint256 / aliked128 / sift128): superpoint_v1.onnx, aliked_n16.onnx, lightglue_{superpoint,aliked,sift}.onnx
                                                     # + sidecars; `pixi run download-feature-models` + `pixi run -e export-features export-superpoint` (plan Q6).
                                                     # The fp32 exports by name; the _fp16 twins are approximate (docs/notes/2026-10-16_features_onnxruntime_host.md)
features_provider: "auto"                            # their ONNX Runtime execution provider: "auto" | "cuda" | "coreml" | "cpu" (megaloc_provider semantics).
                                                     # Measured 2026-10-16, 739x458: SuperPoint 9 ms / ALIKED 16 ms / LightGlue 9-19 ms per call on CUDA (RTX 4000 Ada),
                                                     # 97 / 217 / 83-178 ms on 4 CPU threads; cv::SIFT 22 ms on the CPU either way
features_threads: 4                                  # CPU-provider threads per model session (also the CPU-fallback nodes under CUDA / CoreML)
features_coreml_units: "ALL"                         # CoreML compute units for those models: "ALL" | "CPUAndGPU" | "CPUAndNeuralEngine" | "CPUOnly"
features_static_shapes: false                        # true: load the fixed-shape exports instead of the dynamic files - the detectors' <stem>_<W>x<H>.onnx for the
                                                     # frame size (on the first frame) and the matchers' lightglue_<f>_L<L>.onnx padded to L keypoints per side
                                                     # (the smallest L that fits each pair; the dynamic file beyond). Core ML compiles only bounded shapes, so this
                                                     # is the Mac's GPU path (`export-features --static 672x416 --static-length 1024`; the size the tracker logs, not the raw frame size); a missing file is a hard error.
segmentation: "none" # online semantic segmentation: "efficientvit" | "none"
debug: false
max_frame_wait: 0.2  # s; the mono/rgbd executables replay the sequence at its own rate (sleep for the rest of the
                     # timestamp gap after tracking a frame); this caps that pause so holes in the recording do not
                     # stall the run. Missing, 0 or negative = no cap (original behaviour).

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.TrajectoryLineWidth: 3.0
Viewer.PointSize: 5
Viewer.PointColorMode: "feature"  # map point color: "feature" (feature-type palette) | "rgb" (image color sampled at creation);
                                  # seeds the Viewer checkboxes "Color: Feature" / "Color: RGB" (mutually exclusive); missing key = feature.
                                  # The PLY export always writes the rgb color. Keep the quotes: cv::FileStorage does not
                                  # strip a trailing comment from an unquoted string.
Viewer.MapPointsRefreshHz: 5      # the viewer snapshots the map points into a vertex buffer at most this often (the only
                                  # time it locks the map for drawing points); 0 = every viewer frame; missing key = 5
Viewer.Multisampling: 0           # MSAA samples requested for the window; 0 = off (default). Advisory only: the Pangolin this
                                  # project ships (conda-forge 2024-07-03, EGL-based X11 backend) ignores the request and always
                                  # returns a single-sample framebuffer; the viewer logs what it actually got. Points and lines
                                  # are anti-aliased by GL_POINT_SMOOTH / GL_LINE_SMOOTH regardless.
Viewer.DepthFog: 1                # 1 = fade map points into the background with distance (Viewer checkbox "Depth Fog"); missing key = 1
Viewer.FogStart: 1.5              # fog range in units of the local scene depth D (median point distance to the SLAM camera):
Viewer.FogEnd: 6.0                # clear up to FogStart*D beyond the camera, fully faded from FogEnd*D; missing keys = 1.5 / 6.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
Viewer.StartPaused: 0             # ARStream entry points with the viewer (verbose:1): track one black frame of the stream's size
                                  # (loads every model session, starts no map), then pause until the Viewer's Pause is unticked;
                                  # 0 = track from the first frame (default); missing key = 0

#--------------------------------------------------------------------------------------------
# Optimizer Parameters
#--------------------------------------------------------------------------------------------
# Chi-square outlier thresholds (95% for the 2-DoF reprojection / 3-DoF RGB-D residuals).
# thHuber_* are derived from these (sqrt) at load time -- there is no separate Huber key to set.
Optimizer.Chi2Mono: 5.991
Optimizer.Chi2RGBD: 7.815

# RGB-D depth-channel measurement information (1/variance) for the inverse-depth
# residual -- a starting guess, not yet validated against real sequences (issue #3).
Optimizer.InvDepthInfo: 20000.0

# PoseOptimization()
Optimizer.PoseOptIterations: 10

# OptimizeEssentialGraph()
Optimizer.EssGraphLambdaInit: 1e-16
Optimizer.EssGraphMinFeat: 100
Optimizer.EssGraphIterations: 20

# OptimizeSim3()
Optimizer.Sim3Iterations: 5
Optimizer.Sim3MoreIterationsHigh: 10
Optimizer.Sim3MoreIterationsLow: 5
Optimizer.Sim3MinCorrespondences: 10

#--------------------------------------------------------------------------------------------
# Tracking parameters (values shown are the compiled-in defaults; every key is optional —
# a missing key keeps the default, so this section is safe to trim or edit per dataset)
#--------------------------------------------------------------------------------------------
# Two-view monocular initialization
Tracking.Sequential: 0                  # 1 = deterministic mode: tracking blocks until Local Mapping finishes each keyframe (pair with features: [orb32], vpr: none, verbose: 0)
Tracking.InitMinKeypoints: 100          # min keypoints to accept a frame for init
Tracking.InitSigma: 1.0                 # measurement sigma of the two-view initializer
Tracking.InitMinMatches: 100            # min correspondences (all features pooled) to attempt init
Tracking.InitRansacIterations: 200      # initializer RANSAC budget
Tracking.InitMinMedianDisparity: 10.0   # px; below this (static camera) skip the init attempt
Tracking.InitGbaIterations: 20          # global-BA iterations on the initial map
Tracking.InitMinTrackedPoints: 100      # min tracked points to accept the initial map
Tracking.InitMinDepthSamples: 10        # min sensor-depth samples to prefer metric scale
Tracking.InitExtractorFeaturesScale: 4  # init extractor keeps this x more keypoints
Tracking.NominalImageArea: 307200       # px (640x480): frames are resized to this area (aspect ratio kept) and cropped to a multiple of 32,
                                        # e.g. 739x458 -> 672x416; the size the log reports is the one a static export (features_static_shapes) needs
Tracking.ImageWidth: 0                  # both > 0: resize every frame to exactly this size instead (the aspect ratio may change; the intrinsics
Tracking.ImageHeight: 0                 # are scaled per axis). Use multiples of 32 (640x480 is), or the crop trims the remainder

# Frame-to-frame tracking
Tracking.FrameTracking: "reference_keyframe"    # "reference_keyframe": a descriptor match (LightGlue for the learned features) against the reference
                                                # keyframe on every frame | "optical_flow": KLT of the last frame's tracked points, snapped to the
                                                # current frame's detected keypoints; the reference-keyframe match only as the fallback. Saves the
                                                # per-frame matcher call (41 ms on the M1 Pro GPU, 13 ms on CUDA); measured on the gym before it is the default
Tracking.FlowAssociationRadius: 2.0             # px: a flowed point takes the nearest detected keypoint of its feature type within this radius
Tracking.FlowMaxBackwardError: 1.0              # px: forward-backward KLT disagreement above this drops the track
Tracking.FlowMinMatches: 30                     # map points matched by flow below this -> fall back to the reference-keyframe match
Tracking.TrackRefMinMatches: 15                 # raw matches to the reference keyframe below this -> lost
Tracking.TrackRefMinInliers: 10                 # pose-optimization inliers below this -> lost
Tracking.TrackLocalMapMinInliers: 30            # inliers against the local map below this -> lost
Tracking.TrackLocalMapMinInliersAfterReloc: 50  # stricter bar shortly after a relocalization

# Local map
Tracking.MaxLocalKeyframes: 80        # stop expanding the local map beyond this many keyframes
Tracking.BestCovisibleKeyframes: 10   # covisible neighbors considered per keyframe
Tracking.ViewingCosLimit: 0.5         # frustum viewing-angle limit for local-point candidates

# Keyframe policy. Information = unexplained information of the current view given the local map
# (placecell, on the kernel LocalMapping.InformationKernel selects — the same kernel and centring as
# keyframe culling; [0,1], 1 = nothing in the local map resembles the view). Three bands: below KeyframeMinInformation the view is redundant and no
# keyframe is inserted (replaces the old pixel-flow stationarity gate); above
# LocalMapping.KeyframeCullingMaxUnexplained (tau, the culler's budget: one shared key) the view is
# novel and a keyframe is inserted even if tracking is fine; in between the tracking triggers below decide.
Tracking.KeyframeMinInformation: 0.05 # redundancy band: information below this -> no keyframe (forced keyframes bypass)
Tracking.LogKeyframeInformation: 0    # 1 = one diagnostic line per tracked frame (information, best explainer, triggers, decision)
Tracking.RefMatchesRatio: 0.9         # weak tracking: inliers < ratio x reference-KF tracked points
Tracking.MinInliersForKeyframe: 15    # floor below which a keyframe is not inserted
Tracking.MinObservationsHigh: 3       # reference-KF match counting: min observations per point
Tracking.MinObservationsLow: 2        #   relaxed bar while the map is young
Tracking.YoungMapKeyframes: 2         #   map considered young at <= this many keyframes
Tracking.MinRefOverlap: 0.7           # insert when frame/reference-KF overlap drops below this
Tracking.EmergencyInlierDropRatio: 0.5 # emergency keyframe: inliers < ratio x recent median
Tracking.InliersHistorySize: 30       # recent-inlier reference window (frames)
Tracking.EmergencyKeyframeCooldown: 10 # min frames between emergency keyframes

# Relocalization
Tracking.RelocMinMatches: 15          # per-candidate matching gate
Tracking.RelocInliersHigh: 50         # inliers to accept a pose hypothesis
Tracking.RelocInliersMedium: 30       # enter the narrow-window escalation
Tracking.RelocInliersLow: 10          # below this, abandon the hypothesis
Tracking.RelocSearchRadiusCoarse: 10.0 # first projection-search window
Tracking.RelocSearchRadiusNarrow: 3.0  # second, near-converged window
Tracking.RelocRansacProbability: 0.99  # P4P RANSAC (PnPsolver)
Tracking.RelocRansacMinInliers: 10
Tracking.RelocRansacMaxIterations: 3000
Tracking.RelocRansacEpsilon: 0.5

#--------------------------------------------------------------------------------------------
# Place recognition parameters (vpr: megaloc; values shown are the compiled-in defaults)
#--------------------------------------------------------------------------------------------
PlaceRecognition.MegaLocMinSimilarity: 0.55 # cosine floor for a keyframe to be a reloc/loop candidate (unrelated places ~0.35-0.4, keyframe neighbours ~0.75)
PlaceRecognition.MaxCandidates: 10          # cap on candidates per query (each costs a feature match + PnP/Sim3); 0 = unlimited

#--------------------------------------------------------------------------------------------
# placecell diagnostics (vpr: megaloc; Thirdparty/placecell's print manager, profiler, recorder
# and visualizer). Every key is optional — a missing key keeps the compiled-in default, shown in
# brackets. Flags are 0/1.
#--------------------------------------------------------------------------------------------
# Print manager (process-wide logger; lines look like "[placecell][DEBUG] cull_keyframes: ...", on stderr)
PlaceCell.Verbosity: "warn"       # [warn] off | error | warn | info | debug | trace (or 0-5). WARN = degraded path, INFO = one-off
                                  # facts, DEBUG = one line per add / cull / cull call, TRACE = every information query.
                                  # The environment variable PLACECELL_VERBOSITY overrides this key for a single run.
PlaceCell.LogElapsed: 0           # [0] 1 = prefix placecell lines with the seconds since the logger started
# Profiler (per store: add, unexplained_information, cull_keyframes + its stages, add_image, embed)
PlaceCell.Profile: 1              # [1] time the main entry points, with the problem size of every sample
PlaceCell.PrintProfile: 1         # [0] print the count / median / p95 / max table at shutdown (stderr, ignores Verbosity)
# Recorder (per store: every information query, every cull, Tracking's keyframe decisions and thresholds)
PlaceCell.Record: 1               # [1] keep the history; Dump and Visualize need it
PlaceCell.Dump: 1                 # [0] at the end write kernel.npy / kernel_centred.npy / views.csv, queries.csv / culls.csv /
                                  # cull_calls.csv / alive_information.csv / decisions.csv / thresholds.csv, profile.csv and the
                                  # three plots (kernel.png, information.png, alive.png) to <exp_folder>/<exp_id>_placecell/;
                                  # offline plotting: Thirdparty/placecell/tools/plot_placecell.py <that dir>
# Visualizer (placecell::viz, drawn in a second Pangolin window next to the Viewer's; needs verbose:1)
PlaceCell.Visualize: 1            # [0] open a window with the kernel heatmap, the unexplained-information history (with tau /
                                  # min-information lines, insertions and culls) and the alive unique-information strip;
                                  # Viewer toggle "PlaceCell Window" (closing the window unticks it)
PlaceCell.VisualizeMaxHz: 2.0     # [2.0] re-render the panels at most this often (a render is O(keyframes^2) for the centred kernel)
PlaceCell.VisualizeCentred: 0     # [1] kernel heatmap of the centred kernel (what the culler marginalises with KeyframeCullingCentred 1); 0 = raw cosine (the covisibility kernel)
PlaceCell.VisualizeHistoryLastN: 0 # [0] information history shows only the last N queries (0 = all)

#--------------------------------------------------------------------------------------------
# Local Mapping parameters (values shown are the compiled-in defaults; every key is optional —
# a missing key keeps the default, so this section is safe to trim or edit per dataset)
#--------------------------------------------------------------------------------------------
# Keyframe culling method: "heuristic" (default; ORB-SLAM2-style point redundancy) or "information"
# (joint information on the online MegaLoc similarity kernel; needs vpr: megaloc, otherwise falls
# back to heuristic with a warning)
LocalMapping.MapPointCullingMinFoundRatio: 0.25   # cull a recent map point when found/visible drops below this (all feature types)
LocalMapping.MapPointCullingMinObservations: 2    # cull when, ObservationTestAge keyframes after creation, it has at most this many observations (depth-verified ones count twice)
LocalMapping.MapPointCullingObservationTestAge: 2 # keyframes after creation at which the observation test applies
LocalMapping.MapPointCullingProbationAge: 3       # keyframes after creation at which a surviving point graduates out of probation

LocalMapping.CreateNewMapPointsKeyframes: 5           # covisible keyframes matched and triangulated against per new keyframe
LocalMapping.CreateNewMapPointsMinBaselineDepthRatio: 0.01 # skip neighbors with baseline / median scene depth below this
LocalMapping.CreateNewMapPointsMaxParallaxCos: 0.9998 # two-view triangulation needs cos(parallax) below this (parallax > ~1.15 deg)

LocalMapping.SearchInNeighborsKeyframes: 20       # covisible keyframes fused with each new keyframe
LocalMapping.SearchInNeighborsSecondKeyframes: 5  # second-degree neighbors added per covisible keyframe
LocalMapping.SearchInNeighborsRadius: 5.0         # projection search radius (pixels) for fusion

LocalMapping.KeyframeCullingMethod: information

# Keyframe information kernel, read by the information culler AND Tracking's insertion bands (KeyframeInformation.h):
#   "megaloc"      [default] the vpr: megaloc store's MegaLoc cosine (centred; no kernel at all with vpr: none)
#   "covisibility" cosine of the keyframes' shared map points, K_ij = |P_i & P_j| / sqrt(|P_i| |P_j|): exactly 0 for
#                  keyframes that share nothing, so raw (uncentred); independent of vpr. When KeyframeCullingMaxUnexplained /
#                  KeyframeCullingCentred are ABSENT they default per kernel (megaloc 0.3 / 1, covisibility 0.7 / 0).
LocalMapping.InformationKernel: "covisibility"

# heuristic
LocalMapping.KeyframeCullingRedundancyRatio: 0.9 # cull when more than this fraction of a keyframe's points is redundant
LocalMapping.KeyframeCullingMinObservations: 3   # a point is redundant when this many OTHER keyframes observe it

# information (compiled-in defaults: MaxUnexplained 0.3 [covisibility 0.7], MinAge 5, MinKeyframes 5, Scope map, MaxPerCall 5, Objective unique, Centred 1 [covisibility 0])
LocalMapping.KeyframeCullingMaxUnexplained: 0.5  # tau, shared by culling and insertion: every keyframe ever inserted must stay at least (1 - tau) explained by the alive keyframes, and a view more than tau unexplained by the local map becomes a keyframe (Viewer slider "KF Max Unexplained"); with one explainer v = 1 - s^2, so on the covisibility kernel 0.7 means "shares less than ~55% of its points"
LocalMapping.KeyframeCullingMinAge: 5            # keyframes younger than this many keyframes are never culled
LocalMapping.KeyframeCullingMinKeyframes: 5      # never cull below this many alive keyframes
LocalMapping.KeyframeCullingScope: "map"         # marginalise over "map" (all alive keyframes) or "local" (current keyframe + its covisible keyframes)
LocalMapping.KeyframeCullingMaxPerCall: 5        # at most this many culls per call (0 = unlimited): a raised threshold thins the map gradually instead of in one burst
LocalMapping.KeyframeCullingObjective: "total-loss"  # what gram-greedy ranks the feasible candidates by: "unique" = the candidate's own unique information v_i, "minimax" = the worst unexplained view after the cull, "total-loss" = v_i plus the rise of every other view

LocalMapping.KeyframeCullingCentred: 0           # 1 = correlation of mean-centred descriptors (recommended for megaloc: removes its ~0.37 common-mode floor), 0 = raw cosine (covisibility: unrelated keyframes are exactly 0 already)
# LocalMapping.KeyframeCullingCentred: 1           # 1 = correlation of mean-centred descriptors (recommended for megaloc: removes its ~0.37 common-mode floor), 0 = raw cosine (covisibility: unrelated keyframes are exactly 0 already)

#--------------------------------------------------------------------------------------------
# Loop Closing parameters (values shown are the compiled-in defaults; every key is optional)
#--------------------------------------------------------------------------------------------
LoopClosing.CovisibilityConsistencyThreshold: 3 # a loop candidate's covisibility group must be retrieved by this many consecutive keyframes
LoopClosing.MinKeyframesBetweenLoops: 10        # no loop detection for this many keyframes after a loop closure (and at the start of a map)
LoopClosing.Sim3MinMatches: 20                  # candidates with fewer feature matches to the current keyframe get no Sim3 solver
LoopClosing.Sim3MinInliers: 20                  # inliers of the optimized Sim3 that accept a candidate
LoopClosing.LoopMinMatches: 40                  # loop-side map points matched into the current keyframe (RANSAC inliers + projection search) that accept the loop
LoopClosing.FuseRadius: 4.0                     # projection search radius (px) when fusing the loop-side points into the corrected keyframes
LoopClosing.GbaIterations: 10                   # global bundle adjustment iterations after a loop closure
