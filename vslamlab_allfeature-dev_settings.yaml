%YAML:1.0

# Settings
features: ["orb32", "aliked128"]
features_precision: "fp32"                    # "fp32" | "fp16" (faster on CUDA; accuracy effect not established); `pixi run setup` exports what is missing
features_superpoint_subpixel: true            # sub-pixel SuperPoint keypoints, true peaks only (accuracy effect not established)
features_raco_covariance: true                # weight RaCo keypoints by their own 2x2 covariance; false = 1 px
loop_closure: true                            # false = loops are not detected or closed (relocalization still works)
segmentation: "none"                          # online semantic segmentation: "efficientvit" | "none"

# Tunable
Tracking.FeaturesFraction: 0.5                # keypoints per frame, as a share of each feature's maximum (orb32 4000, learned 2048, others 2000)

MapPoint.DepthInvarianceRatio: 1.2                # a point is expected between its reference distance divided and multiplied by this

LocalMapping.KeyframeCullingMaxUnexplained: 0.5            # tau: culling keeps every keyframe (1 - tau) explained; a view above tau becomes a keyframe

LocalMapping.CreateNewMapPointsKeyframes: 5                # covisible keyframes triangulated against per new keyframe
LocalMapping.CreateNewMapPointsMinBaselineDepthRatio: 0.01 # skip neighbours with baseline / median depth below this
LocalMapping.CreateNewMapPointsMaxParallaxCos: 0.9998      # triangulate only below this cos(parallax) (~1.15 deg)

LocalMapping.SearchInNeighborsKeyframes: 20       # covisible keyframes fused with each new keyframe
LocalMapping.SearchInNeighborsSecondKeyframes: 5  # second-degree neighbours added per covisible keyframe
LocalMapping.FuseDescriptorQuantile: 0.5          # fusion accepts descriptor distances up to this quantile of point-to-observation distances

Error.Chi2Mono: 5.991                         # outlier threshold of a 2-DoF reprojection error (95%), used by every stage
Error.Chi2RGBD: 7.815                         # outlier threshold of a 3-DoF RGB-D error (95%); the Huber deltas are their square roots
Optimizer.LocalBaNeighbors: 10                # best covisible keyframes optimized with the current one

Tracking.FlowAssociationRadius: 2.0           # px: a flowed point takes the nearest keypoint of its feature type within this
Tracking.FlowMaxBackwardError: 1.0            # px: forward-backward KLT disagreement above this drops the track

# Constants
Tracking.NominalImageArea: 307200             # px (640x480): frames are resized to this area and cropped to a multiple of 32 (739x458 -> 672x416)
Tracking.FrameTracking: "reference_keyframe"  # "reference_keyframe" (descriptor match) | "optical_flow"
LocalMapping.InformationKernel: "covisibility"   # "megaloc" (MegaLoc cosine) | "covisibility" (shared map points)


#--------------------------------------------------------------------------------------------
# Camera, place recognition and models
#--------------------------------------------------------------------------------------------
cam_mono: rgb_0
megaloc_onnx: "megaloc_models/megaloc_322x322.onnx" # or megaloc_322x322_fp16.onnx (for CUDA / CoreML); from Thirdparty/placecell/tools/export_megaloc.py
megaloc_provider: "auto"                      # "auto" (CUDA, else CoreML, else CPU) | "cuda" | "coreml" | "cpu"
megaloc_threads: 4                            # CPU-provider threads; never the core count
megaloc_coreml_units: "ALL"                   # "ALL" | "CPUAndGPU" | "CPUAndNeuralEngine" | "CPUOnly" (the Neural Engine loses accuracy)
features_models_dir: "feature_models"         # folder of the exported feature and LightGlue models (`pixi run setup`)
features_provider: "auto"                     # "auto" | "cuda" | "coreml" | "cpu"
features_threads: 4                           # CPU-provider threads per model session
features_coreml_units: "CPUAndGPU"            # "ALL" | "CPUAndGPU" | "CPUAndNeuralEngine" | "CPUOnly"
features_static_shapes: true                  # padded LightGlue exports (L keypoints per side); fixed-size detector exports on Core ML only
debug: false
max_frame_wait: 0.2                           # s: cap on the replay pause between frames; missing, 0 or negative = no cap

#--------------------------------------------------------------------------------------------
# Optimizer
#--------------------------------------------------------------------------------------------

# pose_optimization()
Optimizer.PoseOptIterations: 10             # per round
Optimizer.PoseOptRounds: 4                  # optimize, classify inliers/outliers, repeat
Optimizer.PoseOptRoundsWithKernel: 3        # the Huber kernel is dropped after this many rounds
Optimizer.PoseOptMinCorrespondences: 3      # fewer matches: nothing is optimized
Optimizer.PoseOptMinInliers: 10             # fewer inliers after a round: no further rounds
Optimizer.PoseOptWarnMinCorrespondences: 20 # the rejection warning needs at least this many matches
Optimizer.PoseOptWarnOutlierRatio: 0.5      # and more than this share of them rejected

# local_bundle_adjustment()
Optimizer.LocalBaMinKeyframes: 2            # the map needs more keyframes than this
Optimizer.LocalBaIterations: 5              # first round, every observation
Optimizer.LocalBaRefineIterations: 10       # second round, without the outliers of the first

# global_bundle_adjustment()
Optimizer.FinalGbaIterations: 100           # the bundle adjustment at shutdown
Optimizer.LoopGbaRobust: 0                  # 1 = Huber kernel in the bundle adjustment after a loop closure

# optimize_essential_graph()
Optimizer.EssGraphLambdaInit: 1e-16         # initial damping
Optimizer.EssGraphMinFeat: 100              # min covisibility weight of an edge
Optimizer.EssGraphIterations: 20
Optimizer.EssGraphEdgeInformation: 1.0      # weight of every edge (spanning tree, loop, covisibility)

# optimize_sim3()
Optimizer.Sim3Iterations: 5                 # first round
Optimizer.Sim3MoreIterationsHigh: 10        # second round when the first rejected matches
Optimizer.Sim3MoreIterationsLow: 5          # second round otherwise
Optimizer.Sim3MinCorrespondences: 10        # fewer inliers after the first round: rejected
Optimizer.Sim3Chi2: 10.0                    # outlier threshold of both reprojections (not the 95% value)

#--------------------------------------------------------------------------------------------
# Tracking (every key is optional: a missing key keeps the compiled-in default)
#--------------------------------------------------------------------------------------------
# Initialization
Tracking.Sequential: 0                  # 1 = deterministic: tracking waits for Local Mapping (pair with features: [orb32], verbose: 0)
Tracking.InitMinKeypoints: 100          # min keypoints to accept a frame
Tracking.InitSigma: 1.0                 # measurement sigma of the two-view initializer
Tracking.InitMinMatches: 100            # min matches (all features pooled) to attempt
Tracking.InitRansacIterations: 200
Tracking.InitMinMedianDisparity: 10.0   # px: below this (static camera) skip the attempt
Tracking.InitGbaIterations: 20          # global BA iterations on the initial map
Tracking.InitMinTrackedPoints: 100      # min tracked points to accept the initial map
Tracking.InitMinDepthSamples: 10        # min sensor-depth samples to prefer metric scale
Tracking.ImageWidth: 0                  # both > 0: resize every frame to exactly this size instead of NominalImageArea
Tracking.ImageHeight: 0                 # use multiples of 32

# Frame-to-frame tracking
Tracking.FlowMinMatches: 30                     # fewer flow matches: fall back to the reference-keyframe match
Tracking.TrackRefMinMatches: 15                 # fewer raw matches to the reference keyframe: lost
Tracking.TrackRefMinInliers: 10                 # fewer pose-optimization inliers: lost
Tracking.TrackLocalMapMinInliers: 30            # fewer inliers against the local map: lost
Tracking.TrackLocalMapMinInliersAfterReloc: 50  # the same, shortly after a relocalization

# Local map
Tracking.MaxLocalKeyframes: 80        # the local map stops growing at this many keyframes
Tracking.BestCovisibleKeyframes: 10   # covisible neighbours considered per keyframe
Tracking.ViewingCosLimit: 0.5          # a map point is a candidate (tracking, and fusion in Local Mapping and Loop Closing) only within this cosine of its mean viewing direction (0 = 90 deg)

# Keyframe policy: information = how much of the view the local map does not explain (0..1)
Tracking.KeyframeMinInformation: 0.05 # below this: redundant, no keyframe; above LocalMapping.KeyframeCullingMaxUnexplained: always one
Tracking.LogKeyframeInformation: 0    # 1 = one diagnostic line per tracked frame
Tracking.MinObservationsHigh: 3       # min observations for a point to count as tracked
Tracking.MinObservationsLow: 2        # the same while the map is young
Tracking.YoungMapKeyframes: 2         # the map is young up to this many keyframes
Tracking.EmergencyInlierDropRatio: 0.5 # emergency keyframe when inliers < ratio x recent median
Tracking.InliersHistorySize: 30       # frames in that median
Tracking.EmergencyKeyframeCooldown: 10 # min frames between emergency keyframes

# Relocalization
Tracking.RelocMinMatches: 15          # min matches to try a candidate
Tracking.RelocInliersHigh: 70         # inliers that accept a pose
Tracking.RelocInliersMedium: 30       # above this after the first search: search once more
Tracking.RelocInliersLow: 10          # below this: give the candidate up
Tracking.RelocRansacProbability: 0.99 # P4P RANSAC
Tracking.RelocRansacMinInliers: 10
Tracking.RelocRansacMaxIterations: 3000
Tracking.RelocRansacEpsilon: 0.5

#--------------------------------------------------------------------------------------------
# Place recognition (MegaLoc)
#--------------------------------------------------------------------------------------------
PlaceRecognition.MegaLocMinSimilarity: 0.55 # min cosine for a reloc/loop candidate (unrelated places ~0.35-0.4, neighbours ~0.75)
PlaceRecognition.MaxCandidates: 10          # candidates per query; 0 = unlimited

#--------------------------------------------------------------------------------------------
# Local Mapping (every key is optional: a missing key keeps the compiled-in default)
#--------------------------------------------------------------------------------------------
# Keyframes
KeyFrame.MinCovisibilityWeight: 15                # shared map points two keyframes need to be linked in the covisibility graph

# Map points
MapPoint.MinObservingKeyframes: 3                 # a point that loses an observation and is left with fewer keyframes than this is removed
MapPoint.DepthObservationWeight: 2                # an observation with sensor depth counts this many times in the observation count

# Cull map points
LocalMapping.MapPointCullingMinFoundRatio: 0.25   # cull a recent point when found/visible drops below this
LocalMapping.MapPointCullingMinObservations: 3    # observations a point needs by ObservationTestAge to survive (depth-verified ones count more)
LocalMapping.MapPointCullingObservationTestAge: 2 # keyframes after creation at which that test applies
LocalMapping.MapPointCullingProbationAge: 3       # keyframes after creation at which a surviving point leaves probation

# Keyframe culling (information-based; without a kernel nothing is culled)
LocalMapping.KeyframeCullingMinAge: 5            # younger keyframes are never culled
LocalMapping.KeyframeCullingMinKeyframes: 5      # never cull below this many alive keyframes
LocalMapping.KeyframeCullingScope: "map"         # "map" (all alive keyframes) | "local" (current keyframe and its covisibles)
LocalMapping.KeyframeCullingMaxPerCall: 5        # culls per call; 0 = unlimited
LocalMapping.KeyframeCullingObjective: "total-loss"  # "unique" | "minimax" | "total-loss": how candidates are ranked
LocalMapping.KeyframeCullingCentred: 0           # 1 = mean-centred kernel (for megaloc) | 0 = raw cosine (for covisibility)

#--------------------------------------------------------------------------------------------
# Loop Closing (every key is optional)
#--------------------------------------------------------------------------------------------
LoopClosing.CovisibilityConsistencyThreshold: 3 # consecutive keyframes that must retrieve a candidate's group
LoopClosing.MinKeyframesBetweenLoops: 10        # keyframes without loop detection after a closure
LoopClosing.Sim3MinMatches: 20                  # fewer matches to the current keyframe: no Sim3 solver
LoopClosing.Sim3MinInliers: 20                  # inliers of the optimized Sim3 that accept a candidate
LoopClosing.LoopMinMatches: 40                  # loop-side points matched into the current keyframe that accept the loop
LoopClosing.GbaIterations: 10                   # global BA iterations after a closure

#--------------------------------------------------------------------------------------------
# placecell diagnostics (flags are 0/1; compiled-in default in brackets)
#--------------------------------------------------------------------------------------------
PlaceCell.Verbosity: "warn"       # [warn] off | error | warn | info | debug | trace; PLACECELL_VERBOSITY overrides it
PlaceCell.LogElapsed: 0           # [0] prefix lines with the seconds since start
PlaceCell.Profile: 1              # [1] time the main entry points
PlaceCell.PrintProfile: 1         # [0] print the timing table at shutdown
PlaceCell.Record: 1               # [1] keep the history; Dump and Visualize need it
PlaceCell.Dump: 0                 # [0] write kernels, CSVs and plots to <exp_folder>/<exp_id>_placecell/
PlaceCell.Visualize: 1            # [0] second window with the kernel and information plots (needs verbose:1)
PlaceCell.VisualizeMaxHz: 2.0     # [2.0] max redraws per second
PlaceCell.VisualizeCentred: 0     # [1] draw the centred kernel; 0 = raw cosine
PlaceCell.VisualizeHistoryLastN: 0 # [0] show only the last N queries; 0 = all

#--------------------------------------------------------------------------------------------
# Viewer (keep the quotes on strings: cv::FileStorage does not strip a comment from an unquoted one)
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.TrajectoryLineWidth: 3.0
Viewer.PointSize: 5
Viewer.PointColorMode: "feature"  # "feature" (per-feature palette) | "rgb" (image colour); the PLY export is always rgb
Viewer.MapPointsRefreshHz: 5      # map-point snapshots per second; 0 = every viewer frame
Viewer.Multisampling: 0           # MSAA samples requested; 0 = off (the shipped Pangolin ignores it)
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
Viewer.StartPaused: 1             # ARStream: load every model on one black frame, then wait until Pause is unticked; 0 = track at once
Viewer.StreamStatus: 1            # ARStream: 1 = report the SLAM state to the phone app 10 times a second